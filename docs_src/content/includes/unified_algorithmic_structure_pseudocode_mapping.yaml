# Pseudocode-to-Code Traceability Mapping
# =========================================
# This file maps each logical step in the Unified Algorithmic Structure pseudocode
# to the implementing classes/methods in the codebase.
#
# MAINTENANCE: If a method is renamed or moved, update the corresponding entry here.
# The build process will warn you if a referenced method no longer exists.
#
# Fields:
#   id:              Unique identifier for this mapping (used as HTML data attribute)
#   algo_lines:      Line numbers in the pseudocode (1-based, matching CSS counter)
#   label:           Short human-readable description of the pseudocode step
#   pseudocode_text: The text as it appears in the pseudocode (for display)
#   implementations: List of class.method references that implement this step
#     - module:      Dotted Python module path
#       class:       Class name
#       method:      Method name (use "__init__" for constructors)

mappings:
  # ─────────────────────────────────────────────────────────────────────
  # Lines 1–3: Require: hyperparameters and initial coupling parameters
  # ─────────────────────────────────────────────────────────────────────
  - id: require-hyperparameters
    algo_lines: [1, 2, 3]
    label: "Require hyperparameters and initial coupling parameters"
    pseudocode_text: "Require: hyperparameters and initial coupling parameters in interface storage"
    implementations:
      - module: Distributed_Design_Optimizer.coordination.InputFileInterface
        class: InputFileInterface
        method: get_Subsystems
      - module: Distributed_Design_Optimizer.coordination.InputFileInterface
        class: InputFileInterface
        method: get_CoordinationMethod
      - module: Distributed_Design_Optimizer.coordination.InputFileBasis
        class: InputFileBasis
        method: __init__
      - module: Distributed_Design_Optimizer.coordination.coordinationmethod.CoordinationMethodInterface
        class: CoordinationMethodInterface
        method: createSubSystems
      - module: Distributed_Design_Optimizer.coordination.coordinationmethod.CoordinationMethodInterface
        class: CoordinationMethodInterface
        method: createControllerSubSystem
      - module: Distributed_Design_Optimizer.coordination.Coordinator
        class: Coordinator
        method: __init__
      - module: Distributed_Design_Optimizer.middlelevel.CreateMiddleLevels
        class: CreateMiddleLevels
        method: createMiddleLevels

  # ─────────────────────────────────────────────────────────────────────
  # Line 4: k ← 0
  # ─────────────────────────────────────────────────────────────────────
  - id: init-outerloop
    algo_lines: [4]
    label: "Initialize outerloop iterator"
    pseudocode_text: "k ← 0 (initialize outerloop iterator)"
    implementations:
      - module: Distributed_Design_Optimizer.coordination.Coordinator
        class: Coordinator
        method: run

  # ─────────────────────────────────────────────────────────────────────
  # Line 5: repeat (outerloop)
  # ─────────────────────────────────────────────────────────────────────
  - id: outerloop-repeat
    algo_lines: [5]
    label: "Outer loop repeat"
    pseudocode_text: "repeat"
    implementations:
      - module: Distributed_Design_Optimizer.coordination.Coordinator
        class: Coordinator
        method: run
      - module: Distributed_Design_Optimizer.coordination.Coordinator
        class: Coordinator
        method: outerloop_iteration

  # ─────────────────────────────────────────────────────────────────────
  # Line 6: l ← 0
  # ─────────────────────────────────────────────────────────────────────
  - id: init-innerloop
    algo_lines: [6]
    label: "Initialize innerloop iterator"
    pseudocode_text: "l ← 0 (initialize innerloop iterator)"
    implementations:
      - module: Distributed_Design_Optimizer.coordination.Coordinator
        class: Coordinator
        method: outerloop_iteration

  # ─────────────────────────────────────────────────────────────────────
  # Line 7: repeat (innerloop, following some iteration scheme)
  # ─────────────────────────────────────────────────────────────────────
  - id: innerloop-repeat
    algo_lines: [7]
    label: "Inner loop repeat (following some iteration scheme)"
    pseudocode_text: "repeat (following some iteration scheme)"
    implementations:
      - module: Distributed_Design_Optimizer.coordination.Coordinator
