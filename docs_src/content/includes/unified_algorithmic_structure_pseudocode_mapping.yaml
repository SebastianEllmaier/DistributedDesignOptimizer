  # ─────────────────────────────────────────────────────────────────────
  # Line 12: Post-process the optimization
  # ─────────────────────────────────────────────────────────────────────
  - id: subsystem-postprocess
    algo_lines: [12]
    label: "Post-process the optimization (subsystem)"
    pseudocode_text: "Post-process the optimization"
    implementations:
