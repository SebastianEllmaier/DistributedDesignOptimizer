# ─────────────────────────────────────────────────────────────────────────────
# Math-symbol-level mappings
# ─────────────────────────────────────────────────────────────────────────────
# These map individual mathematical symbols inside the argmin blocks (lines 11
# and 18) to the implementing code.  The hook uses these to wrap matching LaTeX
# tokens with hover/click popups.

math_symbol_mappings:
  - id: math-vf
    symbol_latex: "{}^{i}v_f"
    label: "Local objective function vf"
    implementations:
      - module: Distributed_Design_Optimizer.subsystem.optimization.designproblem.LocalObjectiveInterface
        class: LocalObjectiveInterface
        method: evaluateLocalObjective
      - module: Distributed_Design_Optimizer.subsystem.LocalSubSystemBasis
        class: LocalSubSystemBasis
        method: evaluateLocalObjective
      - module: Distributed_Design_Optimizer.subsystem.LocalSubSystemBasis
        class: LocalSubSystemBasis
        method: get_LocalObjectiveValue

  - id: math-vg
    symbol_latex: "{}^{i}v_g"
    label: "Local inequality constraints vg"
    implementations:
      - module: Distributed_Design_Optimizer.subsystem.optimization.designproblem.LocalConstraintsInterface
        class: LocalConstraintsInterface
        method: evaluateInEqualityLocalConstraints
      - module: Distributed_Design_Optimizer.subsystem.LocalSubSystemBasis
        class: LocalSubSystemBasis
        method: evaluateLocalConstraints

  - id: math-vh
    symbol_latex: "{}^{i}v_h"
    label: "Local equality constraints vh"
    implementations:
      - module: Distributed_Design_Optimizer.subsystem.optimization.designproblem.LocalConstraintsInterface
        class: LocalConstraintsInterface
        method: evaluateEqualityLocalConstraints
