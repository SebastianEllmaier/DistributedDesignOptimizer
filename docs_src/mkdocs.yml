site_name: Distributed Design Optimizer
site_description: A modular Python package for distributed multidisciplinary design
  optimization
site_url: https://sebastianellmaier.github.io/DistributedDesignOptimizer/
repo_url: https://github.com/SebastianEllmaier/DistributedDesignOptimizer
repo_name: DistributedDesignOptimizer
docs_dir: content
site_dir: ../docs

# Allow build to continue even with missing nav entries (outdated references)
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
strict: false

# Exclude raw data files from being built as standalone pages
exclude_docs: |
  includes/abbreviations.md
  includes/symbols.md
  includes/Ellmaier_Group.bib
  includes/Ellmaier_Group_clean.bib
  includes/ieee.csl
  framework-architecture/subsystem-copyfrom.md
  framework-architecture/subsystem-copyto.md
  framework-architecture/subsystem-run-iterative-optimization.md

# Hooks (custom Python scripts for build-time processing)
hooks:
  - hooks/abbreviations.py
  - hooks/symbols.py
  - hooks/citations.py
  - hooks/pseudocode_traceability.py
  - hooks/highlight_classes.py
  - hooks/repo_url.py

# Plugins
plugins:
  - search
  - panzoom:
      # Enable fullscreen mode for diagrams (click button to expand)
      full_screen: true
      # Show hint on hover (not permanently)
      always_show_hint: false
      # Hint location at bottom of diagram
      hint_location: "bottom"
      # Use Alt key + scroll to zoom (prevents accidental zooming)
      key: "alt"
      # Initial zoom level (1.0 = 100%)
      initial_zoom_level: 1.0
      # Mermaid and D2 diagrams are included by default - add img for images
      include_selectors:
        - "img"

theme:
  name: material
  logo: DistributedDesignOptimizer_Logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.top
  - navigation.footer
  - search.highlight
  - search.suggest
  - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Mermaid diagrams support - interactive, clickable UML diagrams
markdown_extensions:
  - abbr
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/pseudocode-sync.js
  - javascripts/collapsible-code.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/custom.css

extra:
  citations:
    bib_file: "content/includes/Ellmaier_Group_clean.bib"
    csl_file: "content/includes/ieee.csl"
    references_url: "includes/references/"

